services:
  - type: web
    name: bot-3whs-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DAILY_TIME
        value: "08:00"
      - key: TIMEZONE
        value: "Asia/Phnom_Penh"
